project:
  name: 'Pobreza e Migração'
  description: 'MSL sobre relações entre pobreza e migração (1980-2024)'
  topic_name: 'pobreza e migração'
  topic_relation: 'relação entre pobreza e migração'

search:
  date_from: 1980
  date_to: 2024
  language: 'en'
  max_pages: 1
  term_groups:
    group_a:
      - 'poverty'
      - 'poor'
      - 'deprivation'
      - 'low income'
    group_b:
      - 'migration'
      - 'migrant'
      - 'immigration'
      - 'emigration'
      - 'displacement'

screening:
  provider: 'mistral'
  model: 'ministral-14b-2512'
  sleep: 3
  threshold: 60
  dimensions:
    - name: 'centralidade_pobreza'
      description: 'pobreza é objeto central do estudo?'
    - name: 'centralidade_migracao'
      description: 'migração é objeto central do estudo?'
    - name: 'relacao_direta'
      description: 'a relação entre pobreza e migração é explicitamente investigada?'
  inclusion_criteria:
    - 'A relação entre pobreza e migração é o objeto central ou um dos objetos centrais do estudo'
    - 'O texto é empírico, estatístico, teórico, quantitativo, qualitativo ou de revisão sobre o tema'
  exclusion_criteria:
    - 'O texto não investiga pobreza nem migração como objeto central'
    - 'O texto não trata de pobreza nem de migração'
    - 'O texto é apenas um editorial, resenha ou nota de pesquisa'
    - 'Pobreza ou migração aparecem apenas como variáveis secundárias ou apenas de controle'
    - 'O tema central é saúde, educação, raça ou outro, com pobreza/migração apenas citadas ou mencionadas'
  additional_exclusion_criteria:
    - 'O texto é um editorial, resenha, introdução de dossiê ou nota de pesquisa'
    - 'O resumo está ausente, truncado ou não descreve o conteúdo do artigo'
    - 'Pobreza e migração aparecem apenas como variáveis de controle ou contexto, não como objeto central do estudo'
    - 'O tema central é outro (ex: saúde, educação, raça) e pobreza/migração são apenas mencionadas'

coding:
  provider: 'groq'
  model: 'llama-3.3-70b-versatile'
  categories:
    - 'Efeitos da migração sobre a pobreza'
    - 'Efeitos da pobreza sobre a migração'
    - 'Remessas e pobreza'
    - 'Migração da população pobre'
    - 'Pobreza e migração com outras dimensões'
    - 'Outro'

